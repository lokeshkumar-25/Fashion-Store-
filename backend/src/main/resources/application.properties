
spring.application.name=fashion-store-backend

server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}

# Allow the frontend origin
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# JWT signing secret (Base64 encoded, 32+ random bytes)
app.jwt.secret=${JWT_SECRET}

# Reduce sensitive error information
server.error.include-stacktrace=never
server.error.include-message=never
